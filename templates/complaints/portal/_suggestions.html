{% if articles %}
<div class="cx-kb" role="status">
  <h3>{% load qa_tags %}{% icon "help" 16 %} These may answer it straight away</h3>
  <ul>{% for a in articles %}<li><a href="{% url 'qa_portal:help_article' a.slug %}" target="_blank" rel="noopener">{{ a.title }}</a><small>{{ a.summary }}</small></li>{% endfor %}</ul>
</div>
{% endif %}
