{% comment %}One row clock. `s` = services.sla_state(...).{% endcomment %}
<span class="cx-sla cx-sla--{{ s.state|default:'none' }}"{% if s.due and s.state != "breached" %} data-cx-due="{{ s.due|date:'c' }}"{% endif %} title="{% if s.due %}Due {{ s.due|date:'D j M, H:i' }}{% endif %}">
  <span class="cx-sla__bar" aria-hidden="true"><span style="--pct: {{ s.pct|default:0 }}%"></span></span>
  <small>{% if s.state == "none" %}No deadline{% else %}{{ s.left }}{% endif %}</small>
</span>
