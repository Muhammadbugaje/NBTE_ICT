{# Stage 3: "unsaved changes" confirmation for Cancel (NBTE.modal, opened by groups.js). #}
<div class="modal-root" id="discard-modal" aria-hidden="true">
  <div class="modal-backdrop"></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="discard-title">
    <button type="button" class="modal-close" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h3 class="modal-title" id="discard-title">Discard your changes?</h3>
    <p>You've changed this page but haven't saved. If you leave now, the changes are lost.</p>
    <div class="form-actions">
      <button type="button" class="btn btn-ghost" data-modal-close>Keep editing</button>
      <a href="#" class="btn btn-danger" data-discard-leave>Discard and leave</a>
    </div>
  </div>
</div>
