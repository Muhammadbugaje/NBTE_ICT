{# Stage 3: section navigation shared by the groups & permissions pages. `section` = users|groups|roles|matrix #}
<nav class="tabs gp-subnav" aria-label="User management">
  {% if perms.accounts.view_user %}
    <a class="tab" href="{% url 'accounts:groups:users' %}"{% if section == "users" %} aria-current="page"{% endif %}>Users</a>
  {% endif %}
  <a class="tab" href="{% url 'accounts:groups:list' %}"{% if section == "groups" %} aria-current="page"{% endif %}>Groups</a>
  {% if perms.accounts.assign_groups %}
    <a class="tab" href="{% url 'accounts:groups:roles' %}"{% if section == "roles" %} aria-current="page"{% endif %}>Roles</a>
  {% endif %}
  <a class="tab" href="{% url 'accounts:groups:matrix' %}"{% if section == "matrix" %} aria-current="page"{% endif %}>Permission matrix</a>
</nav>
