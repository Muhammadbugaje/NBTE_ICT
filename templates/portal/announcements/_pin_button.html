<form class="inline" method="post"
      action="{% url 'portal:announcement_toggle_pin' announcement.pk %}"
      hx-post="{% url 'portal:announcement_toggle_pin' announcement.pk %}"
      hx-target="this"
      hx-swap="outerHTML"
     >
  {% csrf_token %}
  <button type="submit"
          class="btn {% if announcement.is_pinned %}btn-primary{% else %}btn-ghost{% endif %} btn-sm"
          title="{% if announcement.is_pinned %}Unpin this announcement{% else %}Pin this announcement to the top{% endif %}">
    {% if announcement.is_pinned %}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
      Unpin
    {% else %}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
      Pin
    {% endif %}
  </button>
</form>
