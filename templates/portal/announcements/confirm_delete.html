{% extends "portal/_layout.html" %}
{% block title %}Delete announcement{% endblock %}

{% block content %}
<div class="portal-page portal-page-narrow">
  <div class="portal-detail">
    <h2 style="margin-top:0;">Delete “{{ announcement.title }}”?</h2>
    <p class="muted">This is a soft delete — kept for audit, recoverable by an admin. The image file stays on disk.</p>
    <form method="post">
      {% csrf_token %}
      <div class="portal-form-actions">
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'portal:announcement_detail' announcement.pk %}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
