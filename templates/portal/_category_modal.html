{# Universal category quick-create modal. Included once in base.html. #}
<div class="cat-modal" id="cat-modal" hidden>
  <div class="cat-modal-backdrop" data-cat-close></div>
  <div class="cat-modal-panel" role="dialog" aria-modal="true">
    <header class="cat-modal-head">
      <h3>Create a new <span id="cat-modal-kind-label">category</span></h3>
      <button type="button" class="cat-modal-close" data-cat-close aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>

    <form id="cat-modal-form" autocomplete="off">
      <div class="cat-modal-body">
        <label for="cat-modal-name">Name</label>
        <input type="text" id="cat-modal-name" maxlength="80" placeholder="e.g. Events" required>
        <div class="cat-modal-error" id="cat-modal-error"></div>
      </div>
      <footer class="cat-modal-foot">
        <button type="button" class="btn btn-ghost" data-cat-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="cat-modal-submit">Create</button>
      </footer>
    </form>
  </div>
</div>
