{% extends "portal/_layout.html" %}
{% block title %}Delete document{% endblock %}
{% block content %}
<div class="portal-page portal-page-narrow">
  <div class="portal-detail">
    <h2 class="mt-0">Delete “{{ document.title }}”?</h2>
    <p class="muted">Soft delete — the record stays for audit, and all versions remain on disk.</p>
    <form method="post">
      {% csrf_token %}
      <div class="portal-form-actions">
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'portal:document_detail' document.pk %}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
