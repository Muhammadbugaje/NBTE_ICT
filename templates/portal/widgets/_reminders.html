<div class="portal-widget">
  <header class="portal-widget-head">
    <h2>Reminders</h2>
    <a href="{% url 'portal:reminder_list' %}" class="link-btn">See all</a>
  </header>

  {% if reminders %}
    <div class="portal-widget-list">
      {% for r in reminders %}
        <a href="{% url 'portal:reminder_detail' r.pk %}" class="portal-widget-item">
          <div class="portal-widget-thumb portal-widget-thumb-placeholder">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>

          <div class="portal-widget-body">
            <div class="portal-widget-cat">Reminder</div>
            <div class="portal-widget-title">{{ r.title }}</div>
            <div class="portal-widget-time">{{ r.remind_at|date:"M j · H:i" }}</div>
          </div>
        </a>
      {% endfor %}
    </div>
  {% else %}
    <p class="portal-widget-empty">No active reminders.</p>
  {% endif %}
</div>
