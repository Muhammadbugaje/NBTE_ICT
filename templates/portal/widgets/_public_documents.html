<div class="portal-widget">
  <header class="portal-widget-head">
    <h2>Documents</h2>
    <a href="{% url 'portal:public_document_list' %}" class="link-btn">See all</a>
  </header>
  {% if featured or recent %}
    <div class="portal-widget-list">
      {% for d in featured %}
        <a href="{% url 'portal:document_detail' d.pk %}" class="portal-widget-item">
          <div class="portal-widget-thumb portal-widget-thumb-placeholder"
               style="--accent: {{ d.category.color }};">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </div>
          <div class="portal-widget-body">
            <div class="portal-widget-cat" style="--accent: {{ d.category.color }};">★ Featured</div>
            <div class="portal-widget-title">{{ d.title }}</div>
          </div>
        </a>
      {% endfor %}
      {% for d in recent|slice:":3" %}
        {% if d not in featured %}
          <a href="{% url 'portal:document_detail' d.pk %}" class="portal-widget-item">
            <div class="portal-widget-thumb portal-widget-thumb-placeholder"
                 style="--accent: {{ d.category.color }};">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <div class="portal-widget-body">
              <div class="portal-widget-cat" style="--accent: {{ d.category.color }};">{{ d.category.name }}</div>
              <div class="portal-widget-title">{{ d.title }}</div>
            </div>
          </a>
        {% endif %}
      {% endfor %}
    </div>
  {% else %}
    <p class="portal-widget-empty">No public documents yet.</p>
  {% endif %}
</div>
