{% load qa_tags %}<li class="ib-row{% if row.checked %} is-checked{% endif %}" data-ib-name="{{ row.level_code|lower }} {{ row.name|lower }} {{ row.discipline|lower }}">
  <label class="ib-row__pick"><input type="checkbox" name="prog" value="{{ row.key }}" data-price{% if row.checked %} checked{% endif %}>
    <span class="ib-row__name">{% if row.level_code %}<span class="ib-level">{{ row.level_code }}</span>{% endif %}<b>{{ row.name }}</b>
      <small>{% if row.has %}<span class="ib-flag ib-flag--has">{% icon "check" 12 "2.6" %} Has it</span> {{ row.status_label }}{% elif row.proposed %}<span class="ib-flag ib-flag--new">{% icon "plus" 12 "2.6" %} Not yet approved</span> Proposed on its record{% elif row.gone %}<span class="ib-flag ib-flag--new">{% icon "plus" 12 "2.6" %} Can offer</span> Previously {{ row.status_label|lower }}{% else %}<span class="ib-flag ib-flag--new">{% icon "plus" 12 "2.6" %} Does not have it</span> Can be approved{% endif %}{% if row.discipline %} · {{ row.discipline }}{% endif %}{% if row.not_in_master %} · <em>not in the master list</em>{% endif %}</small></span></label>
  <label class="ib-row__streams"><span>Streams</span><input class="input" type="number" name="streams_{{ row.key }}" value="{{ row.streams }}" min="1" max="20" inputmode="numeric" data-price aria-label="Streams for {{ row.level_code }} {{ row.name }}"></label>
</li>
