<style>
.fx{display:grid;gap:1rem}
.fx-back{font-size:.9rem;display:inline-flex;gap:.35rem;align-items:center;text-decoration:none}
.fx-steps{display:flex;gap:.5rem;flex-wrap:wrap;list-style:none;margin:0;padding:0;font-size:.85rem}
.fx-steps li{display:flex;align-items:center;gap:.4rem;padding:.3rem .7rem;border-radius:999px;background:rgba(0,0,0,.04);opacity:.7}
.fx-steps li.is-on{background:rgba(11,110,79,.12);color:#0b6e4f;opacity:1;font-weight:600}
.fx-steps b{display:inline-grid;place-items:center;width:1.3rem;height:1.3rem;border-radius:50%;background:currentColor;color:#fff;font-size:.72rem}
.fx-steps li.is-on b{background:#0b6e4f}
.fx-card{padding:1.1rem 1.25rem}
.fx-card h2{margin:0 0 .35rem;font-size:1.05rem}
.fx-drop{display:grid;place-items:center;gap:.5rem;text-align:center;padding:2rem 1rem;border:2px dashed rgba(11,110,79,.35);border-radius:16px;background:rgba(11,110,79,.03)}
.fx-drop input[type=file]{max-width:100%}
.fx-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.fx-list{margin:.4rem 0 0;padding-left:1.1rem;display:grid;gap:.3rem;font-size:.92rem}
.fx-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.75rem}
.fx-kpi{padding:.85rem 1rem;border-radius:14px;background:var(--surface,#fff);border:1px solid var(--border,rgba(0,0,0,.08))}
.fx-kpi span{display:block;font-size:.76rem;opacity:.7}.fx-kpi strong{font-size:1.45rem;letter-spacing:-.02em}
.fx-kpi.is-new{border-color:rgba(11,110,79,.35);background:rgba(11,110,79,.05)}
.fx-kpi.is-upd{border-color:rgba(79,70,229,.35);background:rgba(79,70,229,.05)}
.fx-kpi.is-warn{border-color:rgba(217,119,6,.45);background:rgba(217,119,6,.06)}
.fx-ask{display:grid;gap:.75rem}
.fx-q{border:1px solid rgba(217,119,6,.35);background:rgba(217,119,6,.04);border-radius:14px;padding:.9rem 1rem;display:grid;gap:.55rem}
.fx-q__title{margin:0;font-weight:600}
.fx-q__hint{margin:0;font-size:.88rem;opacity:.8}
.fx-opts{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center}
.fx-opts label{display:inline-flex;gap:.35rem;align-items:center;cursor:pointer}
.fx-opts select{max-width:min(100%,420px)}
.fx-table-wrap{overflow-x:auto}
.fx-table{width:100%;border-collapse:collapse;font-size:.9rem}
.fx-table th,.fx-table td{padding:.5rem .6rem;border-bottom:1px solid rgba(0,0,0,.07);text-align:left;vertical-align:top}
.fx-table th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;opacity:.7;white-space:nowrap}
.fx-table td.num,.fx-table th.num{text-align:right;font-variant-numeric:tabular-nums}
.fx-table tr.is-same td{opacity:.65}
.fx-pill{display:inline-block;padding:.1rem .5rem;border-radius:999px;font-size:.74rem;font-weight:600;white-space:nowrap}
.fx-pill--new{background:rgba(11,110,79,.12);color:#0b6e4f}
.fx-pill--change{background:rgba(79,70,229,.12);color:#4338ca}
.fx-pill--same{background:rgba(0,0,0,.06);color:inherit}
.fx-pill--warn{background:rgba(217,119,6,.14);color:#92400e}
.fx-pill--ok{background:rgba(11,110,79,.10);color:#0b6e4f}
.fx-muted{opacity:.7;font-size:.85rem}
.fx-ex{margin:.25rem 0 0;padding-left:1rem;font-size:.8rem;opacity:.75}
.fx-bar{position:sticky;bottom:0;z-index:2;display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:center;padding:.85rem 1.1rem;border-radius:16px;background:var(--surface,#fff);border:1px solid var(--border,rgba(0,0,0,.1));box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.fx-filter{display:flex;gap:.5rem;flex-wrap:wrap;margin:.25rem 0 .5rem}
@media (max-width:640px){.fx-table th:nth-child(n+6),.fx-table td:nth-child(n+6){display:none}}
</style>
