<style>
.fe{display:grid;gap:1rem}
.fe-hero{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-end;padding:1.5rem;border-radius:20px;background:linear-gradient(135deg,rgba(79,70,229,.10),rgba(16,122,64,.06));border:1px solid rgba(79,70,229,.2)}
.fe-hero h1{margin:.2rem 0 .4rem}.fe-hero p{max-width:70ch;margin:0;opacity:.85}
.fe-eyebrow{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#4f46e5}
.fe-hero__actions{display:flex;gap:.5rem;flex-wrap:wrap}
.fe-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem}
.fe-kpi{padding:1rem;border-radius:16px;background:var(--surface,#fff);border:1px solid var(--border,rgba(0,0,0,.08))}
.fe-kpi span{display:block;font-size:.78rem;opacity:.7}.fe-kpi strong{font-size:1.6rem;letter-spacing:-.02em}
.fe-kpi.is-warn{border-color:rgba(217,119,6,.45);background:rgba(217,119,6,.05)}
.fe-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.fe-card{padding:1.1rem 1.2rem}
.fe-card__head h2{margin:0 0 .25rem;font-size:1.05rem}
.fe-card__head--row{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center}
.fe-search,.fe-filter{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}
.fe-search .input{flex:1;min-width:0}
.fe-bars{list-style:none;margin:.5rem 0 0;padding:0;display:grid;gap:.35rem}
.fe-bars li{display:grid;grid-template-columns:1fr auto;gap:.5rem;font-size:.9rem}
.fe-bars--meter li{grid-template-columns:minmax(0,1.4fr) 1fr auto;align-items:center}
.fe-meter{height:6px;border-radius:6px;background:rgba(0,0,0,.07);overflow:hidden}.fe-meter i{display:block;height:100%;background:linear-gradient(90deg,#4f46e5,#818cf8)}
.fe-people{list-style:none;padding:0;margin:.5rem 0;display:grid;gap:.35rem}
.fe-people li{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.fe-pick{display:block;padding:.3rem 0}
.fe-sec{margin-top:1rem}
.fe-sec h3{display:flex;gap:.5rem;align-items:baseline;font-size:1rem;margin:0 0 .5rem}
.fe-sec h3 .fe-code{display:inline-grid;place-items:center;min-width:1.7rem;height:1.7rem;border-radius:8px;background:rgba(79,70,229,.12);color:#4338ca;font-size:.8rem}
.fe-qty{width:5.5rem;padding:.25rem .5rem!important;min-height:0!important;height:2rem}
.fe-sec .table td{padding-top:.35rem;padding-bottom:.35rem;vertical-align:middle}
.fe-sec summary{cursor:pointer;list-style:none}.fe-sec summary::-webkit-details-marker{display:none}
.fe-sec summary h3::after{content:"▾";margin-left:auto;opacity:.5}
.fe-row.is-saved td{animation:fe-flash 1.2s ease}
@keyframes fe-flash{0%{background:rgba(22,163,74,.18)}100%{background:transparent}}
.fe-row.is-inactive td{opacity:.5;text-decoration:line-through}
.fe-group td{font-weight:600;background:rgba(0,0,0,.025)}
.fe-toc{display:flex;gap:.35rem;flex-wrap:wrap}
.fe-toc a{font-size:.8rem;padding:.2rem .55rem;border-radius:999px;background:rgba(79,70,229,.08);text-decoration:none}
@media (max-width:640px){.fe-hero{padding:1rem}.fe-qty{width:4rem}}
</style>
