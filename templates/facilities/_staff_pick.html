{% for u in users %}<label class="fe-pick"><input type="radio" name="user" value="{{ u.pk }}" required> {{ u.get_full_name|default:u.email }} <small class="muted">{{ u.email }}</small></label>{% empty %}<p class="muted">Type at least two letters.</p>{% endfor %}
{% if users %}<button class="btn btn-primary btn-sm" type="submit">Add as handler</button>{% endif %}
