{% load qa_tags %}
<div class="rot-modal" role="dialog" aria-modal="true" aria-labelledby="rot-gone-title">
  <div class="rot-modal__backdrop" onclick="document.getElementById('rot-dialog').innerHTML=''"></div>
  <div class="rot-modal__box">
    <span class="rot-modal__grab" aria-hidden="true"></span>
    <h2 id="rot-gone-title">Not assigned</h2>
    <div class="rot-alert" role="alert">{% icon "alert" 16 "2.2" %} {{ error }}</div>
    <div class="btn-group btn-group--end"><button type="button" class="btn btn-primary" onclick="document.getElementById('rot-dialog').innerHTML='';if(window.htmx&&document.getElementById('rot-panel')){htmx.ajax('GET', location.href, {target:'#rot-panel', swap:'innerHTML'});}">Refresh the queue</button></div>
  </div>
</div>
