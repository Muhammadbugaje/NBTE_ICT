{% load qa_tags %}
<nav class="qa-tabs" aria-label="Professional bodies">
  {% url 'qa_pb:list' as u1 %}{% url 'qa_pb:mappings' as u2 %}{% url 'qa_pb:import' as u3 %}
  <a href="{{ u1 }}" hx-get="{{ u1 }}" hx-target="#qa-panel" hx-push-url="true" class="{% if section == 'bodies' %}is-active{% endif %}"{% if section == 'bodies' %} aria-current="page"{% endif %}>Bodies</a>
  <a href="{{ u2 }}" hx-get="{{ u2 }}" hx-target="#qa-panel" hx-push-url="true" class="{% if section == 'mappings' %}is-active{% endif %}"{% if section == 'mappings' %} aria-current="page"{% endif %}>Programme mappings</a>
  {% if can_manage %}<a href="{{ u3 }}" hx-get="{{ u3 }}" hx-target="#qa-panel" hx-push-url="true" class="{% if section == 'import' %}is-active{% endif %}"{% if section == 'import' %} aria-current="page"{% endif %}>Import from Excel</a>{% endif %}
</nav>
