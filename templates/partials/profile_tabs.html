{% load static %}{% if tabs %}
{# v2.1 V7: v21-platform.css is in the "finish" bundle (base.html) #}
<nav class="pf-tabs" aria-label="My profile sections">
  <div class="pf-tabs__track" role="list">
    {% for t in tabs %}
      <a role="listitem" class="pf-tabs__tab{% if t.active %} is-active{% endif %}" href="{{ t.url }}"{% if t.active %} aria-current="page"{% endif %}>
        <span>{{ t.label }}</span>{% if t.badge %}<span class="pf-tabs__badge">{{ t.badge }}</span>{% endif %}
      </a>
    {% endfor %}
  </div>
</nav>
{% endif %}
