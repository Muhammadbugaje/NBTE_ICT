{# Layout override: Auto (follow screen width) · Desktop · Mobile. Stored per browser by ui.js (NBTE.viewMode). #}
<div class="view-switch" role="group" aria-label="Page layout">
  <span class="view-switch-label">Layout</span>
  <button type="button" class="view-switch-btn" data-view-set="auto" aria-pressed="true">Auto</button>
  <button type="button" class="view-switch-btn" data-view-set="desktop" aria-pressed="false">Desktop</button>
  <button type="button" class="view-switch-btn" data-view-set="mobile" aria-pressed="false">Mobile</button>
</div>
