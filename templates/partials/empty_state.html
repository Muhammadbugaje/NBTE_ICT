<section class="nbte-empty-state{% if variant == 'filtered' %} nbte-empty-state--filtered{% endif %}"
         aria-labelledby="empty-state-title">
  {% if icon %}
    <span class="nbte-empty-state__icon" aria-hidden="true">{{ icon }}</span>
  {% endif %}
  <h2 class="nbte-empty-state__title" id="empty-state-title">{{ title }}</h2>
  <p class="nbte-empty-state__body">{{ body }}</p>
  {% if action_url and action_label %}
    <div class="nbte-empty-state__action">
      <a href="{{ action_url }}" class="btn {{ action_class|default:'btn-primary' }}">
        {{ action_label }}
      </a>
    </div>
  {% endif %}
</section>
