{% load static %}{# Shared <head> contents for base.html and base_public.html (UI overhaul v5) #}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{% firstof site_info.organisation_name SITE_NAME "NBTE" %}">
  <meta property="og:title" content="{% firstof og_title SITE_NAME "NBTE ICT Directorate" %}">
  <meta property="og:description" content="{{ site_info.department_name }} — helpdesk, assets, staff records, approvals and internal communication.">
  {% if request %}<meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'img/NBTE_logo.png' %}">
  <meta property="og:url" content="{{ request.build_absolute_uri }}">{% endif %}
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="{% static 'img/NBTE_logo.png' %}" type="image/png">
  <link rel="apple-touch-icon" href="{% static 'img/NBTE_logo.png' %}">
  <script src="{% static 'js/theme-init.js' %}?v=2"></script>
  {# Design system — order matters #}
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}?v=14">
  <link rel="stylesheet" href="{% static 'css/base.css' %}?v=13">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}?v=2">
  <link rel="stylesheet" href="{% static 'css/components.css' %}?v=14">
  <link rel="stylesheet" href="{% static 'css/utilities.css' %}?v=2">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}?v=2">
  <link rel="stylesheet" href="{% static 'css/ux.css' %}?v=3">
