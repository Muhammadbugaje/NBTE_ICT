<header class="nbte-page-header">
  <div class="nbte-page-header__text">
    {% if eyebrow %}<span class="nbte-page-header__eyebrow">{{ eyebrow }}</span>{% endif %}
    <h1 class="nbte-page-header__title">{{ title }}</h1>
    {% if description %}<p class="nbte-page-header__description">{{ description }}</p>{% endif %}
  </div>
  {% if action_url and action_label %}
    <div class="nbte-page-header__actions">
      <a href="{{ action_url }}" class="btn {{ action_class|default:'btn-primary' }}">
        {{ action_label }}
      </a>
    </div>
  {% endif %}
</header>
