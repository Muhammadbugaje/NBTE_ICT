<a href="{{ url }}" class="nbte-list-row">
  {% if leading %}
    <span class="nbte-list-row__leading" aria-hidden="true">{{ leading }}</span>
  {% endif %}
  <span class="nbte-list-row__main">
    <span class="nbte-list-row__title">{{ title }}</span>
    {% if meta %}<span class="nbte-list-row__meta">{{ meta }}</span>{% endif %}
  </span>
  {% if trailing %}
    <span class="nbte-list-row__trailing">{{ trailing }}</span>
  {% endif %}
</a>
