{% if form.non_field_errors %}<div class="form-errors">{{ form.non_field_errors }}</div>{% endif %}
<div class="hist-admin__grid">
  <label class="hist-field hist-field--year"><span>Year</span>{{ form.year }}{{ form.year.errors }}</label>
  <label class="hist-field hist-field--title"><span>Title</span>{{ form.title }}{{ form.title.errors }}</label>
  <label class="hist-field hist-field--wide"><span>What happened</span>{{ form.body }}{{ form.body.errors }}</label>
  <label class="hist-field hist-field--wide"><span>Led by</span>{{ form.led_by }}{{ form.led_by.errors }}</label>
  <label class="hist-field hist-field--wide"><span>Image (optional)</span>{{ form.image }}{{ form.image.errors }}</label>
  <div class="hist-field hist-field--wide hist-checks">
    <label>{{ form.is_published }} {{ form.is_published.label }}</label>
    <label>{{ form.is_current }} {{ form.is_current.label }}</label>
    <label>{{ form.is_placeholder }} {{ form.is_placeholder.label }}</label>
  </div>
</div>
