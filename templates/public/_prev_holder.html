<li class="lead-prev__item">
  <span class="lead-prev__ph" aria-hidden="true">{% if t.person_photo_url %}<img src="{{ t.person_photo_url }}" alt="" loading="lazy">{% else %}{{ t.person_initials }}{% endif %}</span>
  <span class="lead-prev__txt"><b>{{ t.person_name }}</b><span>{{ t.position.name }} · {{ t.period_label }}{% if t.is_acting %} · acting{% endif %}</span>
    {% if t.is_placeholder %}<span><span class="tag-confirm">to confirm</span></span>{% endif %}</span>
</li>
