{# One cell of the A4 sheet (3 x 8): QR + tag + short name. #}
<div class="lbl lbl-cell">
  <div class="lbl-qr">{{ asset.qr_svg|safe }}</div>
  <div class="lbl-info">
    <div class="lbl-tag">{{ asset.asset_tag }}</div>
    <div class="lbl-name">{{ asset.display_name }}</div>
    {% if asset.owner_department %}<div class="lbl-dept">{{ asset.owner_department.name }}</div>{% endif %}
  </div>
</div>
