{% comment %} v2.6: section tabs across the professional-body portal pages. ctx: section_key, pb_tabs (rows with label + url name). {% endcomment %}
{% load qa_tags %}
<nav class="pb-tabs" aria-label="Body sections">
  {% for t in pb_tabs %}{% if t.key == section_key %}<a class="pb-tabs__item is-active" aria-current="page" href="#">{{ t.label }}</a>
  {% else %}<a class="pb-tabs__item" href="{% url t.name %}">{{ t.label }}</a>{% endif %}{% endfor %}
</nav>
