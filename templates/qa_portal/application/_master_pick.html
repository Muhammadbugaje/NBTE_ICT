{% load qa_tags %}{% if picked %}<div class="qa-pick" role="status">
  <input type="hidden" name="master" value="{{ picked.pk }}">
  <div class="qa-pick__main"><strong>{{ picked.name }}</strong><span class="qa-small qa-muted">{{ picked.level.name }} · Code {{ picked.code|upper }}</span></div>
  <div class="qa-pick__body">{% if picked.professional_body %}<span class="qa-chip qa-tone-success">{% icon "check" 14 %} {{ picked.professional_body.name }}</span><span class="qa-small qa-muted">Professional body, filled in from the master list</span>{% else %}<span class="qa-chip">No professional body</span>{% endif %}</div>
  <button type="button" class="btn btn-sm btn-subtle" hx-get="{% url 'qa_portal:programme_master_pick' 0 %}" hx-target="#qa-prog-pick" hx-swap="innerHTML">Change</button>
</div>{% endif %}<div id="qa-prog-list" hx-swap-oob="innerHTML"></div>
