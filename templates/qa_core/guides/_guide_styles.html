<style>
.gd-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:2rem;padding:2rem 16px 4rem;max-width:1180px;margin:0 auto}
.gd-toc{position:sticky;top:90px;align-self:start;font-size:.9rem;display:grid;gap:.5rem;max-height:calc(100vh - 110px);overflow:auto}
.gd-toc ol,.gd-toc ul{margin:0 0 1rem;padding-left:1.1rem;display:grid;gap:.3rem}
.gd-body{font-size:1rem;line-height:1.65;max-width:76ch}
.gd-part{display:flex;gap:.6rem;align-items:center;margin:2.4rem 0 .4rem;font-size:1.5rem;scroll-margin-top:90px}
.gd-part span{display:inline-grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:10px;background:#107a40;color:#fff;font-size:1rem}
.gd-lead{font-size:1.05rem;opacity:.8;margin-top:0}
.gd-steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:.6rem}
.gd-steps li{counter-increment:s;position:relative;padding:.8rem .9rem .8rem 3rem;border-radius:12px;background:rgba(16,122,64,.06)}
.gd-steps li::before{content:counter(s);position:absolute;left:.8rem;top:.8rem;width:1.6rem;height:1.6rem;border-radius:50%;background:#107a40;color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.gd-steps li span{display:block;opacity:.85}
.gd-check{list-style:none;padding-left:0}.gd-check li{padding-left:1.6rem;position:relative}.gd-check li::before{content:"✓";position:absolute;left:0;color:#107a40;font-weight:700}
.gd-box{border-radius:12px;padding:.9rem 1rem;margin:1rem 0;border-left:4px solid}
.gd-box p{margin:.3rem 0 0}
.gd-box--tip{background:rgba(16,122,64,.07);border-color:#16a34a}
.gd-box--important{background:rgba(217,119,6,.08);border-color:#d97706}
.gd-box--note{background:rgba(37,99,235,.06);border-color:#2563eb}
.gd-table{overflow-x:auto;margin:1rem 0}.gd-table table{border-collapse:collapse;width:100%;font-size:.92rem}
.gd-table th,.gd-table td{border:1px solid rgba(0,0,0,.1);padding:.5rem .6rem;text-align:left;vertical-align:top}
.gd-table th{background:rgba(0,0,0,.04)}
.gd-fig img{max-width:100%;border-radius:12px;border:1px solid rgba(0,0,0,.1)}.gd-fig figcaption,.gd-cap{font-size:.85rem;opacity:.7}
.gd-callouts{font-size:.9rem}
.gd-actions{display:flex;gap:.6rem;flex-wrap:wrap}
@media (max-width:860px){.gd-layout{grid-template-columns:1fr}.gd-toc{position:static;max-height:none}}
@media print{.gd-toc,.gd-actions,header,footer,nav{display:none!important}.gd-layout{display:block;padding:0}}
</style>
