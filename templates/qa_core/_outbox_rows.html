{% if page.rows %}
  {% for m in page.rows %}
    <details class="qa-mail">
      <summary class="qa-row qa-row--between"><span><strong>{{ m.subject }}</strong><span class="qa-desc">To {{ m.recipients|join:", " }}</span></span><span class="qa-small qa-muted">{{ m.created_at|date:"j M Y, H:i:s" }} · {{ m.category }}</span></summary>
      <pre>{{ m.body_text|urlize }}</pre>
    </details>
  {% endfor %}
  {% include "qa_core/partials/_pagination.html" with target="#qa-rows" %}
{% else %}<div class="nbte-empty-state qa-empty"><h3 class="nbte-empty-state__title">No messages</h3></div>{% endif %}
