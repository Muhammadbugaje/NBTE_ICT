{% load showcase_tags %}{# Thin, non-animated dashboard banner (showcase app). Renders nothing when no image is set. #}
{% showcase_images "dashboard_banner" 1 as banner_images %}
{% if banner_images %}{% with img=banner_images.0 %}
  <figure class="showcase-banner">
    <img src="{{ img.get_image_url }}" alt="{{ img.alt_text }}" decoding="async">
    {% if img.caption %}<figcaption class="showcase-banner-caption">{{ img.caption }}</figcaption>{% endif %}
  </figure>
{% endwith %}{% endif %}
