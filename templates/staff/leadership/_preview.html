{% if leadership %}
  <section class="lead-preview">
    <header class="lead-preview-head">
      <h2>Leadership</h2>
      <a href="{% url 'staff:public_leadership' %}" class="link-btn">See all →</a>
    </header>
    <div class="lead-preview-grid">
      {% for t in leadership %}
        <a href="{% url 'staff:leadership_tenure' t.pk %}" class="lead-preview-card">
          <div class="lead-preview-photo">
            {% if t.photo %}
              <img src="{{ t.photo_thumb_url }}" alt="">
            {% elif t.staff.photo %}
              <img src="{{ t.staff.photo_thumb_url }}" alt="">
            {% else %}
              {{ t.staff.first_name|slice:":1"|upper }}{{ t.staff.last_name|slice:":1"|upper }}
            {% endif %}
          </div>
          <div class="lead-preview-name">{{ t.staff.full_name }}</div>
          <div class="lead-preview-role">{{ t.position.name }}</div>
        </a>
      {% endfor %}
    </div>
  </section>
{% endif %}
