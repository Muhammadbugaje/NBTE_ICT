<div class="idc idc--back" data-id-face="back">
  <div class="idc__band"></div>
  <div class="idc__qr"{% if live_qr %} data-staff-qr data-qr-url="{{ live_qr.url }}" data-refresh="{{ live_qr.refresh_seconds }}" role="img" aria-label="Verification QR code. It changes every minute."{% else %} role="img" aria-label="Verification QR code"{% endif %}>{% if live_qr %}{{ live_qr.svg|safe }}{% else %}{{ card.qr_svg|safe }}{% endif %}</div>
  <div class="idc__back"><div><b>This card is NBTE property</b>{{ card.return_text }}</div></div>
  <div class="idc__valid"><span>Valid until {{ card.valid_until|date:"j M Y" }}</span></div>
  <div class="idc__sig"><span>{{ card.signatory }}</span></div>
  <div class="idc__foot"></div>
</div>
