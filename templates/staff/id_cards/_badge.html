{% load static %}
<div class="badge-card" data-id-face="badge">
  <div class="idc__band"></div><span class="badge-card__slot" aria-hidden="true"></span>
  <div class="badge-card__hd"><b>NBTE</b><span>National Board for Technical Education</span></div>
  <div class="badge-card__ph">{% include "staff/id_cards/_portrait.html" %}</div>
  <div class="badge-card__b">
    <div class="idc__n">{{ card.name }}</div>
    <div class="idc__r">{{ card.designation }}</div>
    {% if card.department %}<span class="badge-card__dept">{{ card.department }}</span>{% endif %}
  </div>
  <div class="badge-card__qr">{{ card.qr_svg|safe }}</div>
  <div class="idc__foot"></div>
</div>
