<div id="bk-test-{{ dest.pk }}" class="bk-test {% if not dest.last_tested_at %}is-none {% endif %}{% if dest.last_test_ok %}is-ok{% elif dest.last_test_ok is False %}is-bad{% endif %}" role="status" aria-live="polite">
  {% if dest.last_tested_at %}
    <strong>{% if dest.last_test_ok %}Connection OK{% else %}Connection failed{% endif %}</strong>
    <span>{{ dest.last_test_message }}</span>
    <small>Tested {{ dest.last_tested_at|date:"j M Y, H:i" }}</small>
  {% endif %}
</div>
