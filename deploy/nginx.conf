# NBTE ICT - nginx server block (doc 34 §2.1 / §9).
# Replace the three /srv/nbte_ict paths, server_name and the TLS certificate paths;
# keep the structure.
# MEDIA_ROOT and PROTECTED_MEDIA_ROOT must be volumes shared with the `web` container.

upstream nbte_app {
    server 127.0.0.1:8000;          # gunicorn (Compose: web:8000)
}

# Review M19: production forces HTTPS (SECURE_SSL_REDIRECT, HSTS), so nginx
# terminates TLS itself. Port 80 only redirects; the app is served on 443.
# Replace the certificate paths (e.g. from certbot) and server_name.
server {
    listen 80;
    server_name ict.example.org;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot), if used.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ict.example.org;

    ssl_certificate     /etc/letsencrypt/live/ict.example.org/fullchain.pem;   # REPLACE
    ssl_certificate_key /etc/letsencrypt/live/ict.example.org/privkey.pem;     # REPLACE
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;       # uploads; keep in step with any Django limit

    location ~ /\. { deny all; }    # never serve dotfiles

    location /static/ {
        alias /srv/nbte_ict/staticfiles/;
        expires 30d;
    }

    # PUBLIC files: UUID-named, so the URL changes if the content ever does ->
    # safe to cache forever. Gunicorn is never involved.
    # Attachments moved to PROTECTED_MEDIA_ROOT (review H1). These prefixes must
    # never be served from /media/, even if an old copy is left behind.
    location ~ ^/media/(workflow/attachments|workflow/records|tasks|tickets|assets/attachments|messaging|import-tmp)/ {
        return 404;
    }
    # Never serve active content (HTML, SVG, JS, XML) from user uploads.
    location ~* ^/media/.*\.(html?|xhtml|svgz?|js|mjs|xml)$ {
        return 404;
    }

    location /media/ {
        alias /srv/nbte_ict/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # RESTRICTED files: reachable ONLY via Django's "X-Accel-Redirect: /protected/<name>".
    # `internal` makes a direct browser request to this path a 404.
    location /protected/ {
        internal;
        alias /srv/nbte_ict/protected_media/;
    }

    location / {
        proxy_pass http://nbte_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
