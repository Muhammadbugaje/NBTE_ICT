# NBTE ICT - nginx server block (doc 34 §2.1 / §9).
# Replace the three /srv/nbte_ict paths and server_name; keep the structure.
# MEDIA_ROOT and PROTECTED_MEDIA_ROOT must be volumes shared with the `web` container.

upstream nbte_app {
    server 127.0.0.1:8000;          # gunicorn (Compose: web:8000)
}

server {
    listen 80;
    server_name ict.example.org;
    client_max_body_size 25m;       # uploads; keep in step with any Django limit

    location ~ /\. { deny all; }    # never serve dotfiles

    location /static/ {
        alias /srv/nbte_ict/staticfiles/;
        expires 30d;
    }

    # PUBLIC files: UUID-named, so the URL changes if the content ever does ->
    # safe to cache forever. Gunicorn is never involved.
    location /media/ {
        alias /srv/nbte_ict/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # RESTRICTED files: reachable ONLY via Django's "X-Accel-Redirect: /protected/<name>".
    # `internal` makes a direct browser request to this path a 404.
    location /protected/ {
        internal;
        alias /srv/nbte_ict/protected_media/;
    }

    location / {
        proxy_pass http://nbte_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
